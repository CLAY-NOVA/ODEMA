name: iOS build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: RainKit tests
        working-directory: RainKit
        run: swift test

      - name: Build app for iPhone (unsigned)
        run: |
          status=0
          xcodebuild \
            -project Odema.xcodeproj \
            -scheme Odema \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || status=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $status"
            tail -n 80 build.log
            exit "$status"
          fi
          # A failed compile can still leave a partial .app folder: require the binary.
          test -x build/Build/Products/Release-iphoneos/Odema.app/Odema

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Odema.app Payload/
          zip -qr Odema-unsigned.ipa Payload
          ls -lh Odema-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Odema-unsigned-ipa
          path: Odema-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Odema-unsigned.ipa
